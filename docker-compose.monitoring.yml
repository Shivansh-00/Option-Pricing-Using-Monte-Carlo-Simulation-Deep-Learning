# ══════════════════════════════════════════════════════════════
#  OptiQuant — Full Monitoring Stack (Grafana + Prometheus)
# ══════════════════════════════════════════════════════════════
#  Usage:
#    docker compose -f docker-compose.monitoring.yml up -d
#
#  Access:
#    Grafana:     http://localhost:3000  (admin / optiquant2024)
#    Prometheus:  http://localhost:9090
#    Backend:     http://localhost:8000
#    Metrics:     http://localhost:8000/metrics
# ══════════════════════════════════════════════════════════════

services:
  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: optiquant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: optiquant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=optiquant2024
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:8000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/optiquant-overview.json
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ./infra/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
    name: optiquant-monitoring
