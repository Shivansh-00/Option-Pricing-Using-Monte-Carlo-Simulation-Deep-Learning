# ══════════════════════════════════════════════════════════════
#  OptiQuant — Prometheus Configuration
#  Scrapes: Backend API, Nginx, Redis, Node Exporter
# ══════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: optiquant-production
    environment: production

# ── Alerting ─────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Scrape Configs ───────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OptiQuant Backend API
  - job_name: optiquant-backend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend
          tier: api
    # For Kubernetes service discovery:
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names: [optiquant]
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
    #     action: keep
    #     regex: true
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
    #     action: replace
    #     target_label: __address__
    #     regex: (.+)
    #     replacement: ${1}:${2}

  # Nginx (via nginx-prometheus-exporter)
  - job_name: nginx
    static_configs:
      - targets: ['frontend:9113']
        labels:
          service: frontend
          tier: web

  # Redis
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
          tier: cache

  # Node Exporter (system metrics)
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          tier: infrastructure
