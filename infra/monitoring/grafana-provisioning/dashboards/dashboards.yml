# ══════════════════════════════════════════════════════════════
#  Grafana Auto-Provisioning: Dashboards
# ══════════════════════════════════════════════════════════════
apiVersion: 1

providers:
  - name: OptiQuant
    orgId: 1
    folder: OptiQuant
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
