# ══════════════════════════════════════════════════════════════
#  OptiQuant — Prometheus Configuration (Local Development)
# ══════════════════════════════════════════════════════════════
#  Targets adjusted for docker-compose.monitoring.yml networking.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: optiquant-local
    environment: development

rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  # ── Self-Monitoring ──────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── OptiQuant Backend ────────────────────────────────────
  - job_name: optiquant-backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: optiquant-api
          tier: backend

