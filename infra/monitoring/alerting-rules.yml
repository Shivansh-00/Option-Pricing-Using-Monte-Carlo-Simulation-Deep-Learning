# ══════════════════════════════════════════════════════════════
#  OptiQuant — Prometheus Alerting Rules
#  Critical alerts for quant trading infrastructure
# ══════════════════════════════════════════════════════════════

groups:
  # ── Application Health ─────────────────────────────────────
  - name: optiquant.application
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(optiquant_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(optiquant_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: quant-engineering
        annotations:
          summary: "High error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of API requests are failing (5xx)."
          runbook: "Check backend logs: kubectl logs -l app=optiquant-backend -n optiquant"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, 
            sum(rate(optiquant_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 3m
        labels:
          severity: warning
          team: quant-engineering
        annotations:
          summary: "P99 latency above 5s ({{ $value | humanizeDuration }})"
          description: "99th percentile request latency exceeds 5 seconds."

      - alert: HighLatencyPricing
        expr: |
          histogram_quantile(0.95,
            sum(rate(optiquant_pricing_duration_seconds_bucket[5m])) by (le, method)
          ) > 10
        for: 2m
        labels:
          severity: warning
          team: quant-engineering
        annotations:
          summary: "Pricing engine P95 latency > 10s (method={{ $labels.method }})"
          description: "Monte Carlo pricing is taking too long. Consider reducing path count."

      - alert: BackendDown
        expr: up{job="optiquant-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: quant-engineering
        annotations:
          summary: "Backend is DOWN"
          description: "OptiQuant backend API is unreachable."

  # ── WebSocket ──────────────────────────────────────────────
  - name: optiquant.websocket
    interval: 30s
    rules:
      - alert: HighWebSocketConnections
        expr: optiquant_websocket_connections > 500
        for: 5m
        labels:
          severity: warning
          team: quant-engineering
        annotations:
          summary: "High WebSocket connections ({{ $value }})"
          description: "Active WebSocket connections exceed 500."

      - alert: WebSocketErrors
        expr: rate(optiquant_websocket_errors_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
          team: quant-engineering
        annotations:
          summary: "WebSocket errors increasing"
          description: "WebSocket error rate is above 1/s."

  # ── Infrastructure ─────────────────────────────────────────
  - name: optiquant.infrastructure
    interval: 60s
    rules:
      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"
          description: "Node memory usage is above 90%."

      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage ({{ $value }}%)"
          description: "Node CPU usage is above 85%."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} 
          / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk space low ({{ $value | humanizePercentage }} free)"
          description: "Less than 15% disk space remaining."

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="optiquant"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          team: quant-engineering
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting frequently."

  # ── Database ───────────────────────────────────────────────
  - name: optiquant.database
    interval: 60s
    rules:
      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) / 
          sum(pg_settings_max_connections) > 0.80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connections at {{ $value | humanizePercentage }}"
          description: "Database connection pool is over 80% utilized."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory at {{ $value | humanizePercentage }}"
          description: "Redis is using more than 85% of max memory."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is DOWN"
          description: "ElastiCache Redis is unreachable."

  # ── Model Performance ──────────────────────────────────────
  - name: optiquant.models
    interval: 60s
    rules:
      - alert: ModelPredictionDrift
        expr: |
          abs(optiquant_model_prediction_mean - optiquant_model_prediction_baseline)
          / optiquant_model_prediction_baseline > 0.20
        for: 15m
        labels:
          severity: warning
          team: quant-research
        annotations:
          summary: "Model prediction drift detected ({{ $value | humanizePercentage }})"
          description: "Model predictions have drifted >20% from baseline. Review model health."

      - alert: MonteCarloConvergenceSlow
        expr: optiquant_mc_convergence_iterations > 100000
        for: 5m
        labels:
          severity: info
          team: quant-research
        annotations:
          summary: "Monte Carlo convergence is slow"
          description: "MC simulations are requiring >100K iterations to converge."
