# ══════════════════════════════════════════════════════════════
#  OptiQuant Backend — Kubernetes Deployment
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optiquant-backend
  namespace: optiquant
  labels:
    app: optiquant-backend
    tier: api
    version: v2.0.0
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: optiquant-backend
  template:
    metadata:
      labels:
        app: optiquant-backend
        tier: api
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: optiquant-backend
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      # Anti-affinity: spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - optiquant-backend
                topologyKey: kubernetes.io/hostname
      
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo waiting for db; sleep 2; done']
      
      containers:
        - name: backend
          image: ECR_REPO_URL/optiquant/backend:latest  # Replace with actual ECR URL
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: optiquant-config
            - secretRef:
                name: optiquant-secrets
          
          env:
            - name: ENV
              value: "production"
            - name: APP_ROOT_DIR
              value: "/app"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp/prometheus"
          
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: optiquant-models-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: optiquant-backend-svc
  namespace: optiquant
  labels:
    app: optiquant-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: optiquant-backend
---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: optiquant-backend
  namespace: optiquant
  labels:
    app: optiquant-backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/optiquant-production-app-role
---
# PVC for models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: optiquant-models-pvc
  namespace: optiquant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
