# ══════════════════════════════════════════════════════════════
#  OptiQuant — Ingress (AWS ALB Ingress Controller)
# ══════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optiquant-ingress
  namespace: optiquant
  labels:
    app: optiquant
  annotations:
    # AWS ALB Ingress Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    
    # WAF
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:ACCOUNT_ID:regional/webacl/optiquant-waf/WAF_ID
    
    # Sticky sessions
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
    
    # Load balancer attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: >
      idle_timeout.timeout_seconds=120,
      routing.http2.enabled=true,
      routing.http.drop_invalid_header_fields.enabled=true
spec:
  rules:
    - host: optiquant.ai
      http:
        paths:
          # API routes → Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: optiquant-backend-svc
                port:
                  number: 8000
          
          # WebSocket routes → Backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: optiquant-backend-svc
                port:
                  number: 8000
          
          # Health & Metrics → Backend
          - path: /health
            pathType: Exact
            backend:
              service:
                name: optiquant-backend-svc
                port:
                  number: 8000
          
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: optiquant-backend-svc
                port:
                  number: 8000
          
          # Everything else → Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: optiquant-frontend-svc
                port:
                  number: 80
    
    # www redirect
    - host: www.optiquant.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: optiquant-frontend-svc
                port:
                  number: 80
