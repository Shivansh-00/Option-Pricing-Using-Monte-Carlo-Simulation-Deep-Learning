# ══════════════════════════════════════════════════════════════
#  OptiQuant — Production Docker Compose Stack
#  Services: Backend, Frontend, PostgreSQL, Redis, Prometheus, Grafana
#  Usage: docker-compose -f infra/docker-compose.prod.yml up --build
# ══════════════════════════════════════════════════════════════

services:
  # ── Backend (FastAPI + Gunicorn + Uvicorn Workers) ─────────
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.prod.Dockerfile
    container_name: optiquant-backend
    env_file:
      - ../.env
    environment:
      - APP_ROOT_DIR=/app
      - FRONTEND_DIR=frontend
      - MODEL_DIR=models
      - ENV=production
      - DATABASE_URL=postgresql://optiquant:${POSTGRES_PASSWORD:-optiquant_secret}@postgres:5432/optiquant
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - PROMETHEUS_MULTIPROC_DIR=/app/prometheus
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - ../backend/app/rag/knowledge_base:/app/app/rag/knowledge_base:ro
      - prometheus_data:/app/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    networks:
      - optiquant-net
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  # ── Celery Worker (async tasks: benchmarks, heavy MC) ──────
  celery-worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.prod.Dockerfile
    container_name: optiquant-celery
    env_file:
      - ../.env
    environment:
      - APP_ROOT_DIR=/app
      - ENV=production
      - DATABASE_URL=postgresql://optiquant:${POSTGRES_PASSWORD:-optiquant_secret}@postgres:5432/optiquant
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: ["celery", "-A", "app.celery_app", "worker",
              "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=100"]
    volumes:
      - model_data:/app/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - optiquant-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Nginx SPA + Reverse Proxy) ──────────────────
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.prod.Dockerfile
    container_name: optiquant-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    networks:
      - optiquant-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL (Auth & Data Store) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: optiquant-postgres
    environment:
      POSTGRES_DB: optiquant
      POSTGRES_USER: optiquant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optiquant_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiquant -d optiquant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - optiquant-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (Caching + Celery Broker + Pub/Sub) ─────────────
  redis:
    image: redis:7-alpine
    container_name: optiquant-redis
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
        --requirepass ${REDIS_PASSWORD:-optiquant_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-optiquant_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - optiquant-net

  # ── Prometheus (Metrics Collection) ────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: optiquant-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_ts_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - optiquant-net

  # ── Grafana (Dashboards & Alerting) ────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: optiquant-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-optiquant_grafana}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - optiquant-net

volumes:
  model_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  prometheus_ts_data:
    driver: local
  grafana_data:
    driver: local

networks:
  optiquant-net:
    driver: bridge
    name: optiquant-production
