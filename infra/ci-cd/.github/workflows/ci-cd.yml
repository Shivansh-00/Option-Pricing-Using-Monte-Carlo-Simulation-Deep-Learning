# ══════════════════════════════════════════════════════════════
#  OptiQuant — CI/CD Pipeline
#  Build, Test, Push to ECR, Deploy to EKS
# ══════════════════════════════════════════════════════════════

name: OptiQuant CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: optiquant-production-eks

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Lint & Static Analysis
  # ═══════════════════════════════════════════════════════════
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff bandit safety mypy

      - name: Ruff linting
        run: ruff check backend/app/ --output-format=github

      - name: Bandit security scan
        run: bandit -r backend/app/ -c bandit.yaml -f json -o bandit-report.json || true

      - name: Safety dependency check
        run: safety check -r backend/requirements.txt --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ═══════════════════════════════════════════════════════════
  #  Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: optiquant_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/optiquant_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
          JWT_SECRET: test-secret-key
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            backend/coverage.xml
            backend/test-results.xml
            backend/htmlcov/

  # ═══════════════════════════════════════════════════════════
  #  Build & Push Docker Images
  # ═══════════════════════════════════════════════════════════
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service:
          - name: backend
            dockerfile: infra/docker/backend.prod.Dockerfile
          - name: frontend
            dockerfile: infra/docker/frontend.prod.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/optiquant/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/optiquant/${{ matrix.service.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ═══════════════════════════════════════════════════════════
  #  Deploy to Staging
  # ═══════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.optiquant.ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name optiquant-staging-eks --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # Update image tags
          cd infra/k8s
          kustomize edit set image \
            ECR_REPO_URL/optiquant/backend=${{ env.ECR_REGISTRY }}/optiquant/backend:${{ github.sha }} \
            ECR_REPO_URL/optiquant/frontend=${{ env.ECR_REGISTRY }}/optiquant/frontend:${{ github.sha }}
          
          kubectl apply -f namespace.yaml
          kubectl apply -Rf backend/
          kubectl apply -Rf frontend/
          kubectl apply -Rf redis/
          kubectl apply -Rf ingress/
          kubectl apply -Rf autoscaling/
          
          # Wait for rollout
          kubectl rollout status deployment/optiquant-backend -n optiquant --timeout=300s
          kubectl rollout status deployment/optiquant-frontend -n optiquant --timeout=120s

      - name: Smoke test
        run: |
          STAGING_URL="https://staging.optiquant.ai"
          for i in {1..30}; do
            if curl -sf "${STAGING_URL}/health" | grep -q "healthy"; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Waiting for deployment... ($i/30)"
            sleep 10
          done
          echo "✗ Health check failed"
          exit 1

  # ═══════════════════════════════════════════════════════════
  #  Deploy to Production
  # ═══════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://optiquant.ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy with canary strategy
        run: |
          IMAGE_TAG="${{ github.sha }}"
          BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/optiquant/backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${{ env.ECR_REGISTRY }}/optiquant/frontend:${IMAGE_TAG}"
          
          # Apply namespace and configs first
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/backend/configmap.yaml
          kubectl apply -f infra/k8s/backend/network-policy.yaml
          
          # Update backend image
          kubectl set image deployment/optiquant-backend \
            backend=${BACKEND_IMAGE} \
            -n optiquant
          
          # Update frontend image
          kubectl set image deployment/optiquant-frontend \
            frontend=${FRONTEND_IMAGE} \
            -n optiquant
          
          # Apply autoscaling and ingress
          kubectl apply -Rf infra/k8s/autoscaling/
          kubectl apply -Rf infra/k8s/ingress/
          
          # Wait for rollout
          kubectl rollout status deployment/optiquant-backend -n optiquant --timeout=600s
          kubectl rollout status deployment/optiquant-frontend -n optiquant --timeout=300s

      - name: Post-deploy verification
        run: |
          PROD_URL="https://optiquant.ai"
          
          echo "═══ Health Check ═══"
          curl -sf "${PROD_URL}/health" | python3 -m json.tool
          
          echo "═══ Readiness Check ═══"
          curl -sf "${PROD_URL}/ready" | python3 -m json.tool
          
          echo "═══ Pod Status ═══"
          kubectl get pods -n optiquant -o wide
          
          echo "═══ HPA Status ═══"
          kubectl get hpa -n optiquant

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production deployment successful"
          echo "Image: ${{ github.sha }}"
          echo "Timestamp: $(date -u)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed — initiating rollback"
          kubectl rollout undo deployment/optiquant-backend -n optiquant
          kubectl rollout undo deployment/optiquant-frontend -n optiquant
          kubectl rollout status deployment/optiquant-backend -n optiquant --timeout=300s
